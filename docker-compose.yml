services:
  postgres:
    image: postgres:16-alpine
    container_name: fraud-sentinel-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fraud_sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud_pass}
    ports:
      - "5433:5432"
    volumes:
      - fraud_sentinel_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fraud_user} -d ${POSTGRES_DB:-fraud_sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fraud-sentinel-redis
    ports:
      - "6379:6379"
    volumes:
      - fraud_sentinel_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    container_name: fraud-sentinel-kafka
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --smp 1
      - --memory 256M
      - --overprovisioned
    ports:
      - "19092:19092"
    volumes:
      - fraud_sentinel_redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fraud_sentinel_data:
  fraud_sentinel_redis:
  fraud_sentinel_redpanda: